<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix OS - Full Restore</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@11.0.0"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; color: #00ff41; }
        #matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.1; }
        
        /* Login Overlay */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 500; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { z-index: 600; text-align: center; border: 1px solid #00ff41; padding: 25px; background: #000; box-shadow: 0 0 20px #00ff41; }
        .pass-input { background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px; width: 160px; text-align: center; outline: none; font-size: 20px; margin-top: 15px; }

        /* Top Bar Stats (CPU, PING, NODE) */
        .top-stats { display: none; justify-content: space-between; padding: 5px 15px; font-size: 11px; border-bottom: 1px solid rgba(0, 255, 65, 0.2); background: rgba(0, 10, 0, 0.9); z-index: 100; }

        /* Main System UI */
        .system-container { display: none; flex-direction: column; height: calc(100vh - 25px); padding: 15px; box-sizing: border-box; }

        /* RGB Auto Radar Display */
        .radar-box { 
            position: absolute; top: 45px; right: 20px; width: 85px; height: 85px; 
            border: 2px solid #00ff41; border-radius: 50%; overflow: hidden; 
            background: radial-gradient(circle, rgba(0,34,0,0.5) 0%, #000 80%);
            animation: radarRGB 8s linear infinite; /* Auto Color Change */
        }
        @keyframes radarRGB {
            0% { border-color: #00ff41; box-shadow: 0 0 10px #00ff41; }
            25% { border-color: #00ffff; box-shadow: 0 0 10px #00ffff; }
            50% { border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
            75% { border-color: #ffff00; box-shadow: 0 0 10px #ffff00; }
            100% { border-color: #00ff41; box-shadow: 0 0 10px #00ff41; }
        }
        .radar-box::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 10px 10px;
        }
        .radar-sweep { 
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; 
            background-image: conic-gradient(from 0deg, rgba(0, 255, 65, 0.6) 0%, transparent 50%); 
            transform-origin: top left; animation: sweep 3s linear infinite; 
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Terminal Logs */
        .boot-log { flex-grow: 1; overflow-y: auto; font-size: 13px; line-height: 1.5; margin-top: 10px; }
        .boot-log::-webkit-scrollbar { display: none; }
        .input-line { display: flex; align-items: center; padding: 10px 0; border-top: 1px solid rgba(0, 255, 65, 0.1); }
        .prompt { color: #ff00ff; margin-right: 8px; font-weight: bold; }
        #cmdInput { background: transparent; border: none; color: #fff; outline: none; flex: 1; font-family: inherit; font-size: 16px; }

        /* Popup Boxes */
        .custom-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; background: #000; border: 1px solid #ff00ff; padding: 20px; display: none; z-index: 1000; }
        .ok { color: #00ffff; }
        .crit { color: #ff3131; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="loginOverlay">
    <div class="login-box">
        <div style="color:#ff00ff; font-weight:bold; letter-spacing: 2px;">[ SECURE TERMINAL ]</div>
        <input type="password" id="passInput" class="pass-input" autofocus maxlength="4">
    </div>
</div>

<div class="top-stats" id="statBar">
    <div>PING: <span id="pingVal" style="color:#ffff00;">--</span>ms</div>
    <div>CPU: <span id="cpuVal" style="color:#00ffff;">0</span>%</div>
    <div style="color:#ff00ff;">NODE: SGP-SYNC</div>
</div>

<div class="system-container" id="mainSystem">
    <div class="radar-box"><div class="radar-sweep"></div></div>
    
    <div id="bootLog" class="boot-log"></div>

    <div class="input-line">
        <span class="prompt">root@system:~#</span>
        <input type="text" id="cmdInput" autocomplete="off" spellcheck="false">
    </div>
</div>

<div id="noteBox" class="custom-popup">
    <div style="color:#ff00ff; margin-bottom:10px;">[ INJECT DATA ]</div>
    <textarea id="noteInput" style="width:100%; height:100px; background:#111; color:#00ff41; border:1px solid #333; padding:10px; resize:none; outline:none;"></textarea>
    <button onclick="saveNote()" style="width:100%; padding:12px; margin-top:10px; background:#00ffff; border:none; font-weight:bold;">SYNC TO CLOUD</button>
</div>

<div id="listBox" class="custom-popup">
    <div style="color:#ff00ff; margin-bottom:10px;">[ DATA STORE ]</div>
    <div id="noteContent" style="max-height:250px; overflow-y:auto; font-size:12px; color:#00ffff;"></div>
    <button onclick="document.getElementById('listBox').style.display='none'" style="width:100%; padding:10px; margin-top:15px; background:#ff3131; color:#fff; border:none;">CLOSE</button>
</div>

<script>
    const { Client, Databases, ID } = Appwrite;
    const client = new Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('69a48f7100363311b552');
    const databases = new Databases(client);
    const DATABASE_ID = '69a48f91000d098cf751';
    const COLLECTION_ID = 'usernotes';

    // Login logic
    document.getElementById('passInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value === "1234") {
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('statBar').style.display = "flex";
            document.getElementById('mainSystem').style.display = "flex";
            startStatsUpdater();
            runBoot();
        }
    });

    // Stats Updater (CPU & PING)
    function startStatsUpdater() {
        setInterval(async () => {
            document.getElementById('cpuVal').innerText = Math.floor(Math.random() * 15) + 5;
            const start = Date.now();
            try {
                await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Appwrite.Query.limit(1)]);
                document.getElementById('pingVal').innerText = Date.now() - start;
            } catch (e) { document.getElementById('pingVal').innerText = "ERR"; }
        }, 4000);
    }

    // Boot Sequence
    function runBoot() {
        const sequence = ["[0.02] Kernel Boot...", "[0.45] Radar Drivers: <span class='ok'>LOADED</span>", "[0.89] Cloud Link: <span class='ok'>ACTIVE</span>", "System Ready."];
        let i = 0;
        const itv = setInterval(() => {
            if (i < sequence.length) { printLog(sequence[i]); i++; }
            else { clearInterval(itv); document.getElementById('cmdInput').focus(); }
        }, 400);
    }

    // Terminal Commands
    document.getElementById('cmdInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = e.target.value.toLowerCase().trim();
            printLog(`<span class='prompt'>root@system:~#</span> ${e.target.value}`);
            if (val === "install note") document.getElementById('noteBox').style.display = "block";
            else if (val === "list") fetchNotes();
            else if (val === "clear") document.getElementById('bootLog').innerHTML = "";
            e.target.value = "";
        }
    });

    // Save Note & Auto Clear
    async function saveNote() {
        const field = document.getElementById('noteInput');
        const content = field.value;
        try {
            await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), { content: content });
            printLog("<span class='ok'>[OK]</span> Data Sync Complete.");
            field.value = ""; // Clear input
            document.getElementById('noteBox').style.display = "none";
        } catch (e) { printLog("<span class='crit'>[ERR]</span> Sync Failed."); }
    }

    async function fetchNotes() {
        document.getElementById('listBox').style.display = "block";
        const contentDiv = document.getElementById('noteContent');
        contentDiv.innerHTML = "Fetching Cloud Data...";
        try {
            const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID);
            contentDiv.innerHTML = res.documents.map(d => `<div style='margin-bottom:8px; border-bottom:1px dashed #333;'>ID[${d.$id.substring(0,8)}]: ${d.content}</div>`).join("");
        } catch (e) { contentDiv.innerHTML = "Fetch Error."; }
    }

    function printLog(msg) {
        const div = document.createElement('div'); div.innerHTML = msg;
        const log = document.getElementById('bootLog');
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    // Matrix Rain Background
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/18)).fill(1);
    setInterval(() => {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#0F0";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*10), i*18, y*18);
            if(y*18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }, 50);
</script>
</body>
</html>
